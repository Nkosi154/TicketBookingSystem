{% extends 'base.html' %}
{% block title %}Create Discount Code - TicketFlow{% endblock %}

{% block content %}
<div style="max-width:540px; margin:0 auto;">
    <div style="background:rgba(0,255,135,0.05); border:1px solid rgba(0,255,135,0.15); border-radius:var(--radius-sm); padding:14px 18px; margin-bottom:24px;">
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:2px; text-transform:uppercase; letter-spacing:0.5px;">Creating discount for</p>
        <p style="font-weight:700; color:var(--text-primary);">{{ event.title }}</p>
    </div>

    <div style="margin-bottom:24px;">
        <h2 style="margin-bottom:4px;">Create Discount Code</h2>
        <p>Student codes require verified university email to redeem.</p>
    </div>

    <div class="form-card">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div style="display:flex; gap:12px; margin-top:16px;">
                <button type="submit" class="btn btn-neon btn-lg" style="flex:1;">Create Code →</button>
                <a href="{% url 'event_stats' event.pk %}" class="btn btn-ghost btn-lg" style="flex:1; justify-content:center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
